name: quran_app
description: "تطبيق قرآننا - القرآن الكريم ومواقيت الصلاة والأذكار"
publish_to: 'none'

# versionName = 1.1.0  |  versionCode = 10
version: 1.1.0+10

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  badges: ^3.1.2
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  quran: ^1.3.3
  provider: ^6.1.4
  dio: ^5.8.0+1
  geolocator: ^13.0.4
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  timezone: ^0.10.0
  connectivity_plus: ^6.1.4
  intl: ^0.18.1
  lottie: ^3.3.1
  url_launcher: ^6.3.1
  flutter_background_service: ^5.1.0
  flutter_staggered_animations: ^1.1.1
  flutter_animate: ^4.2.0
  animations: ^2.0.7
  share_plus: ^11.0.0
  android_alarm_manager_plus: ^4.0.7
  flutter_local_notifications: ^18.0.1
  permission_handler: ^12.0.0+1
  workmanager: ^0.6.0
  android_intent_plus: ^5.3.0
  geocoding: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/azkar.json
    - assets/icons/
    - assets/quran_frame.png
    - assets/fonts/
    - assets/pagesQuran.json
    - assets/data/quran_image/
    - assets/sebhaBody.png
    - assets/icons/azkr.png
    - assets/Image HomeScreen/
    - assets/Image HomeScreen/logoApp.png
    - assets/Images sala/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf

    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
